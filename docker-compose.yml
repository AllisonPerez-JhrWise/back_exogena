# Solo para desarrollo local. En AWS la app corre desde el Dockerfile contra la RDS.
services:
  app:
    build:
      context: .
      # wise-comun desde la carpeta de al lado (sin CodeArtifact): ver Dockerfile
      additional_contexts:
        wise_comun: ../wise-comun
      args:
        WISE_COMUN_FROM: local
    image: back-exogena
    container_name: back-exogena-app
    user: root
    volumes:
      - type: bind
        source: .
        target: /app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # En desarrollo corre un solo proceso con recarga automática
      WEB_CONCURRENCY: 1
    depends_on:
      db:
        condition: service_healthy
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000
    # Permite que `make up` espere hasta que la app responda antes de migrar
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  db:
    # Misma versión mayor que la RDS (18.6)
    image: postgres:18
    container_name: back-exogena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18 guarda los datos en /var/lib/postgresql/18/docker
      - back-exogena-db-18:/var/lib/postgresql
      # Al crear la base por primera vez: roles, estructura de la plataforma y catálogos de la nube
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  back-exogena-db-18:
    name: back-exogena-db-18
