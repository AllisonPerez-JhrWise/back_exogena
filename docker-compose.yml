# Solo para desarrollo local. En AWS la app corre desde el Dockerfile contra la RDS.
services:
  app:
    build: .
    image: back-exogena
    container_name: back-exogena-app
    user: root
    volumes:
      - type: bind
        source: .
        target: /app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # En desarrollo corre un solo proceso con recarga automática
      WEB_CONCURRENCY: 1
    depends_on:
      db:
        condition: service_healthy
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000
    # Permite que `make up` espere hasta que la app responda antes de migrar
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  db:
    image: postgres:15
    container_name: back-exogena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - back-exogena-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  back-exogena-db:
    name: back-exogena-db
