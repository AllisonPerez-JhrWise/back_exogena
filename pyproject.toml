[project]
name = "back-exogena"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify (reglas activas)
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI usa Depends() como valor por defecto
    "E712",  # comparaciones de SQLAlchemy como columna == False
    "UP046", # Generic[T] se lee mejor con Pydantic / SQLModel que PEP 695
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
