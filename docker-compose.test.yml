# Ejecución aislada de tests: `make test`. No necesita ningún archivo .env.
services:
  db_test:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exogena_test
    tmpfs:
      - /var/lib/postgresql
    # Igual que la base local: roles, estructura de la plataforma y catálogos de la nube
    volumes:
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exogena_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  app_test:
    build:
      context: .
      additional_contexts:
        wise_comun: ../wise-comun
      args:
        WISE_COMUN_FROM: local
    image: back-exogena
    user: root
    working_dir: /app
    volumes:
      - type: bind
        source: .
        target: /app
    environment:
      ENVIRONMENT: test
      DB_HOST: db_test
      DB_PORT: "5432"
      DB_NAME: exogena_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      # Vacíos: anulan los del .env local (que se monta con el código)
      DB_ADMIN_USER: ""
      DB_ADMIN_PASSWORD: ""
      COGNITO_USER_POOL_ID: us-east-2_test
      COGNITO_CLIENT_ID: test-client
    depends_on:
      db_test:
        condition: service_healthy
    command: >
      sh -c "pip install -q -r requirements/test.txt &&
             pytest -v --tb=short"
